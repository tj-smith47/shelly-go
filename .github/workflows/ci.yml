name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write
  pull-requests: read
  checks: write
  security-events: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Build
        run: task build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: true

      - name: Run integration tests
        run: go test -tags=integration ./...
        continue-on-error: true # Integration tests may fail without real devices

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        run: task lint

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.29.0
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: results.sarif

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.26.4"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Download dependencies
        run: task deps

      - name: Run tests (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          task test:ci
          # Filter coverage to library packages (exclude examples/tools main packages).
          bash scripts/coverage.sh
        env:
          SHELLY_CI: "1"

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: task test:ci
        env:
          SHELLY_CI: "1"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/master' && matrix.os == 'ubuntu-latest'
        run: bash scripts/update-coverage-badge.sh
