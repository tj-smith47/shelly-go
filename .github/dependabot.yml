version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    # Skip day-zero releases: a dep bumped this week is not re-bumped next
    # week when its follow-up patch ships.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
      # Security updates ignore the schedule and arrive on advisory day; this
      # group folds them into one PR per ecosystem instead of one per dep.
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    # Skip day-zero releases: a dep bumped this week is not re-bumped next
    # week when its follow-up patch ships.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-modules:
        patterns: ["*"]
      # Security updates ignore the schedule and arrive on advisory day; this
      # group folds them into one PR per ecosystem instead of one per dep.
      go-modules-security:
        applies-to: security-updates
        patterns: ["*"]
